<!doctype html>
<html lang="ja" class="theme-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日本史ノート</title>
<meta name="description" content="日本史の整理・暗記ノート（年表・赤シート・苦手管理）">
<meta name="theme-color" content="#F4F0E6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="日本史ノート">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" href="./icon-180.png">
<script>
  /* 画面が出る前にテーマを合わせる（ちらつき防止） */
  try {
    var t = localStorage.getItem('nhnote.theme') || 'auto';
    var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.className = dark ? 'theme-dark' : 'theme-light';
  } catch (e) {}
</script>
<style>html,body{background:#f4f0e6;margin:0}html.theme-dark,html.theme-dark body{background:#171513}#splash{color:#857d6f;letter-spacing:.1em;place-items:center;font:600 15px -apple-system,Hiragino Sans,Yu Gothic UI,sans-serif;display:grid;position:fixed;inset:0}</style>
  <script type="module" crossorigin src="./app.js"></script>
  <link rel="stylesheet" crossorigin href="./app.css">
</head>
<body>
<div id="splash">日本史ノート</div>
<div id="app"></div>
</body>
</html>
